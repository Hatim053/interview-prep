<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="weather-app">

    <!-- Search -->
    <div class="search-box">
      <input type="text" class="input" placeholder="Search city..." />
      <button class="search-btn">Search</button>
    </div>

    <!-- Current Weather -->
    <div class="current-weather">

      <div class="location">
        <h2>New York, USA</h2>
        <p>Region: New York</p>
        <p>Local Time: 2026-01-01 09:00</p>
      </div>

      <div class="weather-info">
        <img src="https://cdn.weatherapi.com/weather/64x64/day/116.png" alt="condition" />
        <h1>22°C</h1>
        <p>Partially Cloudy</p>

        <div class="extra">
          <span>💨 12 km/h</span>
          <span>Updated: 08:45</span>
        </div>
      </div>

    </div>

    <!-- 7 Day Forecast -->
    <div class="forecast">

      <div class="day-card">
        <p class="date">01 Jan</p>
        <img src="https://cdn.weatherapi.com/weather/64x64/day/116.png" />
        <p>Partially Cloudy</p>
        <p class="temp">25° / 18°</p>
      </div>

    

    </div>

  </div>
</body>
<script src="script.js"></script>
</html>
